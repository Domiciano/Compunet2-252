name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Los despliegues de Pages se ENCOLAN, no se cancelan. Con
# `cancel-in-progress: true` un push seguido de otro aborta el workflow mientras
# la publicación ya está en marcha, y la API de Pages se queda creyendo que sigue
# en curso: a partir de ahí todo despliegue posterior falla con "due to in
# progress deployment" y el sitio se queda con el bundle viejo. Pasó el
# 2026-07-26 en FlutterApps y el 2026-07-27 en Computacion2.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: classnotesapp/package-lock.json

      - name: Install dependencies
        working-directory: classnotesapp
        run: npm ci

      # El base path sale del nombre del repo, no escrito a mano. Este workflow
      # corre en los dos remotos (Domiciano/Compunet2-252 y
      # DomicianoRincon/Computacion2) y GitHub Pages sirve cada uno bajo su propio
      # nombre. Con el valor fijo, la copia de Compunet2-252 apuntaba a
      # /Computacion2/assets/… — rutas inexistentes en ese host— y salía en blanco.
      - name: Build
        working-directory: classnotesapp
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # 404.html no pasa por Vite (va tal cual desde public/), así que su
      # `repoBase` se parchea aquí. El literal /compu2 tiene que seguir siendo el
      # que está en public/404.html y el defecto de vite.config.js.
      - name: Patch 404.html base path
        run: sed -i 's|/compu2|/${{ github.event.repository.name }}|g' classnotesapp/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: classnotesapp/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
